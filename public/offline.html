<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Finanza</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1524;
        color: #eef3fb;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(47, 143, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #9fb2c9;
        margin: 0;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #2f8fff;
        color: white;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2f8fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 9a16 16 0 0 1 22 0" />
          <path d="M5 13a12 12 0 0 1 14 0" />
          <path d="M9 17a4 4 0 0 1 6 0" />
          <line x1="12" y1="20" x2="12" y2="20" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No pudimos conectar con Finanza. Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
